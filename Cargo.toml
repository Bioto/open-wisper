[workspace]
members = [
    "src/nexus_recorder",
    "src/nexus_dictation",
]
default-members = [
    "src/nexus_recorder",
    "src/nexus_dictation",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
